# Sequential Phased on Fashion-MNIST
# Test scalability to more challenging dataset

experiment:
  name: "fashion_mnist_sequential_phased"
  approach: "sequential_phased"
  seed: 42
  device: "auto"

data:
  dataset: "fashion_mnist"
  batch_size: 512
  num_workers: 4
  normalize: true

model:
  architecture: "hybrid_ff_bp"
  input_dim: 784
  ff_hidden_dims: [500, 500, 500]
  num_classes: 10
  ff_threshold: 2.0

training:
  approach: "sequential_phased"

  phase1:
    epochs: 100
    learning_rate: 0.03
    threshold: 2.0
    negative_strategy: "random_label"

  phase2a:
    epochs: 50
    learning_rate: 0.001
    optimizer: "adam"
    freeze_ff: true

  phase2b:
    enabled: true
    epochs: 50
    learning_rate: 0.0001
    optimizer: "adam"

evaluation:
  save_checkpoints: true
  checkpoint_freq: 20
  log_interval: 10
  compute_linear_probing: true
  save_tsne: true

logging:
  use_tensorboard: true
  tensorboard_dir: "results/tensorboard"
  save_dir: "results/fashion_mnist_sequential_phased"
