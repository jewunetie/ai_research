# Detached Interface: Simultaneous FF+BP Training
# Novel approach with gradient detachment

experiment:
  name: "mnist_detached_interface"
  approach: "detached_interface"
  seed: 42
  device: "auto"

data:
  dataset: "mnist"
  batch_size: 512
  num_workers: 4
  normalize: true

model:
  architecture: "hybrid_ff_bp"
  input_dim: 784
  ff_hidden_dims: [500, 500, 500]
  num_classes: 10
  ff_threshold: 2.0

training:
  approach: "detached_interface"
  num_epochs: 150  # Combined FF+BP training

  # FF Configuration (Unsupervised)
  ff_config:
    learning_rate: 0.03
    threshold: 2.0
    negative_strategy: "random_label"

  # BP Configuration (Supervised)
  bp_config:
    learning_rate: 0.001
    optimizer: "adam"

evaluation:
  save_checkpoints: true
  checkpoint_freq: 20
  log_interval: 10
  compute_linear_probing: true
  save_tsne: true

logging:
  use_tensorboard: true
  tensorboard_dir: "results/tensorboard"
  save_dir: "results/mnist_detached_interface"
