[project]
name = "mece-step-by-step"
version = "0.1.0"
description = "MECE Step by Step Reasoning: Testing whether MECE constraints improve reasoning completeness in LLMs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MECE Research Team"}
]
license = {text = "MIT"}

dependencies = [
    # MLX for Apple Silicon optimization (M4 Max)
    "mlx>=0.18.0",
    "mlx-lm>=0.18.0",

    # Core ML/NLP libraries
    "transformers>=4.45.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.1.0",  # With MPS (Metal Performance Shaders) support
    "tokenizers>=0.19.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",  # For cosine similarity and metrics

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Configuration and utilities
    "pydantic>=2.0.0",  # Data validation
    "pyyaml>=6.0",
    "tqdm>=4.65.0",

    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Alternative to MLX (if needed)
llama-cpp = [
    "llama-cpp-python>=0.2.0",  # With Metal support for M4 Max
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
